name: build-and-boot

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ready-to-boot GUI ISO
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tree
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 cpio xorriso curl gzip isolinux syslinux-common e2fsprogs util-linux libegl1 libxkbcommon0

      - name: Install hosted desktop dependencies
        run: python3 -m pip install --no-cache-dir -r requirements.txt

      - name: Hosted desktop smoke test
        run: QT_QPA_PLATFORM=offscreen python3 -m pythonos.desktop.main --smoke-test

      - name: Capture hosted desktop proof image
        run: make desktop-shot

      - name: Host-side unit tests
        run: make unittest

      - name: Stage the native GUI root filesystem
        run: make rootfs-gui

      - name: Build the ready-to-boot GUI ISO
        run: make iso-gui

      - name: Boot-test the ready-made ISO in QEMU
        run: PYTHONOS_QEMU_MEMORY=768 make test

      - name: Boot-test the installed root and recovery initramfs
        run: PYTHONOS_QEMU_MEMORY=768 make test-installed

      - name: Show the self-test reports
        if: always()
        run: |
          for log in release/boot-selftest.log release/installed-boot-selftest.log release/installed-recovery-selftest.log release/installed-automatic-recovery.log; do
            if [ -f "$log" ]; then
              echo "===== $log ====="
              grep -aE "PASS|FAIL|SELFTEST|emergency|Traceback|panic" "$log" | tail -n 40 || true
            fi
          done

      - name: Upload boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-selftest-logs
          path: |
            release/boot-selftest.log
            release/installed-boot-selftest.log
            release/installed-recovery-selftest.log
            release/installed-automatic-recovery.log
          if-no-files-found: warn

      - name: Upload ready-made ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pythonos-0.1-gui-iso
          path: release/pythonos-0.1.iso
          retention-days: 30

      - name: Upload initramfs packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pythonos-0.1-gui-initramfs
          path: |
            release/initramfs-lts
            release/initramfs-installed
          retention-days: 30

      - name: Upload hosted desktop proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-desktop-proof
          path: docs/screenshots/hosted-desktop.png
          retention-days: 30

      - name: Publish ISO to the GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/pythonos-0.1.iso
            release/initramfs-lts
            release/initramfs-installed
