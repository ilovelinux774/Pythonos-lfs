Section "ServerFlags"
    Option "AllowMouseOpenFail" "true"
    Option "AutoAddDevices" "true"
EndSection

# Keep the deterministic QEMU/DRM path as the default. VirtualBox's
# vmwgfx/vboxvideo modules are loaded alongside this; its VMSVGA/VBoxSVGA
# controller can use the Xorg VMware/VESA fallback when the controller is
# configured correctly.
Section "Device"
    Identifier "PythonOS modesetting"
    Driver "modesetting"
    Option "AccelMethod" "none"
    # Avoid VirtualBox VMSVGA hardware-cursor artefacts on older hosts.
    Option "SWcursor" "true"
EndSection

Section "InputClass"
    Identifier "PythonOS libinput"
    MatchIsPointer "on"
    Driver "libinput"
EndSection

# Alpine's vmmouse package supplies a udev rule for the i8042 AUX port. This
# covers VirtualBox's default PS/2 pointer when its integration protocol is
# available, while libinput remains the normal fallback for ordinary devices.
